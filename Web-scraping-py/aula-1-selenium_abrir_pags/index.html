<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário Selenium</title>
</head>
<body>

    <button onclick="alertar()">Clique em mim</button>

    <br><br>

    <label>Ative e desative as checkbox</label>

    <input type="checkbox" name="checkbox">
    <input type="checkbox" name="checkbox">

    <br><br>

    <label>Selecione o vermelho por RGB 232 33 33</label>

    <input type="color">

    <br><br>

    <label>Quando é o aniversário da sua cidade?</label>

    <input type="date" name="data">

    <br><br>

    <label>Que dias e que horas você nasceu?</label>

    <input type="datetime-local" name="datetime">

    <br><br>

    <label>Faça upload de um arquivo</label>

    <input type="file" name="arquivo">

    <br><br>

    <label>Selecione um mês e um ano</label>

    <input type="month" name="mes">

    <br><br>

    <label>Só inputs numéricos aqui</label>

    <input type="number" name="numero">

    <br><br>

    <label>Cuidado para não revelar a sua senha!</label>

    <input type="password" name="senha">

    <br><br>

    <label>Escolha apenas uma opção</label>

    <input type="radio" name="radio">
    <input type="radio" name="radio">
    <input type="radio" name="radio">

    <br><br>

    <label>Escolha um valor entre 0 e 100</label>

    <input type="range" name="range" min="0" max="100">

    <br><br>

    <label>Que horas são?</label>

    <input type="time" name="hora">

    <br><br>

    <label>Escolha uma semana</label>

    <input type="week" name="semana">

    <br><br>

    <label>Escreva 5 linhas</label>

    <br>

    <textarea rows="10" cols="40"></textarea>

    <br><br>

    <label>Escolha uma opção</label>

    <select>
        <option>A</option>
        <option>B</option>
        <option>C</option>
    </select>
    <script src="script.js"></script>
</body>
</html>
